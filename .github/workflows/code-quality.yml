name: Code quality

on: workflow_call
permissions: {}

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          node-version: 22
          install-dependencies: true
          package-manager: npm
          all-files: true

  translation-checks:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - name: Translation checks
        uses: govuk-one-login/github-actions/node/run-script@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          node-version: 22
          package-manager: npm
          script: npm run check-translation
